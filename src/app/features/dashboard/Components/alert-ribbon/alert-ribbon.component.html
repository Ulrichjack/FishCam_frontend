@if(store.debtors().length > 0){
  <div class="overflow-x-auto whitespace-nowrap bg-fc-red-light border border-fc-red border-opacity-30 rounded-xl px-4 py-3 mb-6">
    <h3 class="text-sm font-semibold text-fc-red mb-2">⚠️ Clients en dépassement de seuil</h3>
    @for(debtor of store.debtors(); track debtor.id)
     {
      <app-debtor-pill [debtor]="debtor">
      </app-debtor-pill>
    }
  </div>
}
