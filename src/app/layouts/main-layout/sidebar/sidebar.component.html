<!-- Sidebar Container -->
<aside class="w-64 flex-shrink-0 bg-gray-800 text-gray-300 flex flex-col">

  <!-- Logo Section -->
  <div class="h-16 flex items-center justify-center px-4 border-b border-gray-700">
    <a routerLink="/dashboard" class="flex items-center gap-2">
      <img src="public/assets/logo.svg" alt="FishCam Logo" class="h-10 w-auto bg-white rounded-md p-1"/>
      <span class="text-xl font-bold text-white">FishCam ERP</span>
    </a>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-2 py-4 space-y-1">

    <!-- Dashboard Link -->
    <a routerLink="/dashboard"
       routerLinkActive="bg-gray-700 text-white"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center px-2 py-2.5 text-sm font-medium rounded-md hover:bg-gray-700 hover:text-white transition-colors">
      <lucide-icon name="layout-dashboard" class="mr-3 h-5 w-5"></lucide-icon>
      Tableau de bord
    </a>

    <!-- Achats Link -->
    <a routerLink="/achats"
       routerLinkActive="bg-gray-700 text-white"
       class="flex items-center px-2 py-2.5 text-sm font-medium rounded-md hover:bg-gray-700 hover:text-white transition-colors">
      <lucide-icon name="shopping-cart" class="mr-3 h-5 w-5"></lucide-icon>
      Achats
    </a>

    <!-- Clients Link -->
    <a routerLink="/clients"
       routerLinkActive="bg-gray-700 text-white"
       class="flex items-center px-2 py-2.5 text-sm font-medium rounded-md hover:bg-gray-700 hover:text-white transition-colors">
      <lucide-icon name="users" class="mr-3 h-5 w-5"></lucide-icon>
      Clients
    </a>

  </nav>

</aside>
