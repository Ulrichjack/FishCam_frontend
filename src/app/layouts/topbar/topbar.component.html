<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-gray-200 bg-white/80 px-5 backdrop-blur-xl">

  <!-- Left Side -->
  <div class="flex items-center gap-3">
    <button (click)="mobileMenuClicked.emit()"
            class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 lg:hidden">
      <lucide-icon name="menu" class="h-5 w-5"></lucide-icon>
    </button>
    <h1 class="text-lg font-semibold text-gray-900">{{ pageTitle() }}</h1>
  </div>

  

  <!-- Right Side -->
  <div class="flex items-center gap-4">
    <button routerLink="/notifications"
            class="relative flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100">
      <lucide-icon name="bell" class="h-5 w-5"></lucide-icon>
      @if (unreadCount() > 0) {
        <span class="absolute -top-0.5 -right-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white">
          {{ unreadCount() }}
        </span>
      }
    </button>

    <div class="h-6 w-px bg-gray-200"></div>

    <div class="flex items-center gap-2.5">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-600 text-sm font-bold text-white">
        {{ initials() }}
      </div>
      <div class="hidden sm:flex flex-col leading-tight">
        <span class="text-sm font-semibold text-gray-900">{{ authStore.user()?.firstName }} {{ authStore.user()?.lastName }}</span>
        <span class="text-xs text-gray-500">{{ authStore.user()?.role }}</span>
      </div>
    </div>
  </div>
</header>
